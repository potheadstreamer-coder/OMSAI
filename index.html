<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Om Sai Commercial - Premium Agro Commodities, Spices, and Herbal Products. Global Supply & Sourcing Expert.">
    <title>Om Sai Commercial | Global Supply & Sourcing Expert</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bebas+Neue&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        * {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .hero-title {
            font-family: 'Oswald', 'Bebas Neue', sans-serif;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body class="bg-white">
    
    <!-- Navigation -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 bg-white shadow-md transition-all duration-300">
        <!-- Top Bar -->
        <div class="bg-[#2d6a4f] text-white py-2 px-4 hidden md:block">
            <div class="max-w-7xl mx-auto flex justify-between items-center text-sm">
                <div class="flex items-center gap-6">
                    <a href="mailto:ranjit@omsaicommercial.com" class="flex items-center gap-2 hover:text-[#e76f51] transition-colors">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                        ranjit@omsaicommercial.com
                    </a>
                    <a href="tel:+9779805905337" class="flex items-center gap-2 hover:text-[#e76f51] transition-colors">
                        <i data-lucide="phone" class="w-4 h-4"></i>
                        +977 980-590-5337
                    </a>
                </div>
                <div class="text-sm">Established in Year 2021</div>
            </div>
        </div>
        
        <!-- Main Navigation -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center gap-3">
                    <img src="https://customer-assets.emergentagent.com/job_agro-spices/artifacts/t68rt8nc_ChatGPT%20Image%20Feb%201%2C%202026%2C%2005_11_11%20PM.png" alt="Om Sai Commercial" class="h-16 w-16 object-contain">
                    <span class="text-xl font-bold text-[#2d6a4f] hidden md:block">Om Sai Commercial</span>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#home" class="text-gray-700 hover:text-[#2d6a4f] font-medium transition-colors">Home</a>
                    <a href="#about" class="text-gray-700 hover:text-[#2d6a4f] font-medium transition-colors">Why Us</a>
                    <a href="#products" class="text-gray-700 hover:text-[#2d6a4f] font-medium transition-colors">Products</a>
                    <a href="#manufacturing" class="text-gray-700 hover:text-[#2d6a4f] font-medium transition-colors">Manufacturing</a>
                    <a href="#services" class="text-gray-700 hover:text-[#2d6a4f] font-medium transition-colors">Services</a>
                    <a href="#contact" class="text-gray-700 hover:text-[#2d6a4f] font-medium transition-colors">Contact</a>
                    <a href="#contact" class="bg-[#e76f51] text-white px-6 py-2.5 rounded-lg font-medium hover:bg-[#d35d3f] transition-all duration-300 hover:shadow-lg hover:scale-105">Get Quote</a>
                </div>
                
                <button id="mobile-menu-btn" class="md:hidden text-gray-700">
                    <i data-lucide="menu" class="h-6 w-6"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden hidden bg-white border-t border-gray-200 shadow-lg">
            <div class="px-4 py-4 space-y-3">
                <a href="#home" class="block px-4 py-2 text-gray-700 hover:bg-[#f4f1de] hover:text-[#2d6a4f] rounded-lg transition-colors">Home</a>
                <a href="#about" class="block px-4 py-2 text-gray-700 hover:bg-[#f4f1de] hover:text-[#2d6a4f] rounded-lg transition-colors">Why Us</a>
                <a href="#products" class="block px-4 py-2 text-gray-700 hover:bg-[#f4f1de] hover:text-[#2d6a4f] rounded-lg transition-colors">Products</a>
                <a href="#manufacturing" class="block px-4 py-2 text-gray-700 hover:bg-[#f4f1de] hover:text-[#2d6a4f] rounded-lg transition-colors">Manufacturing</a>
                <a href="#services" class="block px-4 py-2 text-gray-700 hover:bg-[#f4f1de] hover:text-[#2d6a4f] rounded-lg transition-colors">Services</a>
                <a href="#contact" class="block px-4 py-2 text-gray-700 hover:bg-[#f4f1de] hover:text-[#2d6a4f] rounded-lg transition-colors">Contact</a>
                <a href="#contact" class="block text-center bg-[#e76f51] text-white px-6 py-2.5 rounded-lg font-medium hover:bg-[#d35d3f] transition-colors">Get Quote</a>
            </div>
        </div>
    </nav>
    
    <!-- Spacer -->
    <div class="h-20 md:h-[100px]"></div>
    
    <!-- Main Content Container -->
    <div id="app"></div>
    
    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Mobile menu toggle
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
        
        // Close mobile menu when clicking a link
        document.querySelectorAll('#mobile-menu a').forEach(link => {
            link.addEventListener('click', function() {
                document.getElementById('mobile-menu').classList.add('hidden');
            });
        });
        
        // Smooth scroll with offset
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    const offset = 80;
                    const elementPosition = target.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - offset;
                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
    
</body>
</html>
